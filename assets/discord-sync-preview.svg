<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Discord Sync dashboard preview</title>
  <desc id="desc">Mockup demonstrativo de um painel operacional de sincronização de assinaturas com Discord usando dados fictícios.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6F8FB"/>
      <stop offset="1" stop-color="#EAF1F8"/>
    </linearGradient>
    <linearGradient id="accent" x1="196" y1="52" x2="1180" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB"/>
      <stop offset="0.52" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <style>
      .font { font-family: Inter, Segoe UI, Arial, sans-serif; }
      .h1 { font-size: 34px; font-weight: 800; fill: #0F172A; }
      .h2 { font-size: 18px; font-weight: 800; fill: #0F172A; }
      .label { font-size: 12px; font-weight: 700; fill: #64748B; letter-spacing: .02em; }
      .body { font-size: 14px; font-weight: 600; fill: #334155; }
      .muted { font-size: 12px; font-weight: 600; fill: #64748B; }
      .number { font-size: 30px; font-weight: 850; fill: #0F172A; }
      .white { fill: #FFFFFF; }
      .green { fill: #047857; }
      .amber { fill: #B45309; }
      .red { fill: #B91C1C; }
      .blue { fill: #1D4ED8; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1280" height="720" rx="0" fill="url(#bg)"/>
  <rect x="34" y="28" width="1212" height="664" rx="28" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <rect x="34" y="28" width="1212" height="664" rx="28" stroke="#DDE7F2"/>

  <rect x="34" y="28" width="166" height="664" rx="28" fill="#0F172A"/>
  <rect x="34" y="28" width="166" height="664" rx="28" stroke="#111827"/>
  <circle cx="78" cy="78" r="23" fill="url(#accent)"/>
  <path d="M66 80c15-30 31-30 24 2" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <path d="M69 91h27" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <text x="112" y="72" class="font white" font-size="15" font-weight="800">Ops</text>
  <text x="112" y="92" class="font" font-size="12" font-weight="700" fill="#94A3B8">Discord Sync</text>

  <g class="font">
    <text x="62" y="150" fill="#94A3B8" font-size="12" font-weight="800">MENU</text>
    <rect x="54" y="174" width="124" height="38" rx="12" fill="#1E293B"/>
    <circle cx="74" cy="193" r="5" fill="#38BDF8"/>
    <text x="90" y="198" fill="#E2E8F0" font-size="13" font-weight="750">Visão geral</text>
    <circle cx="74" cy="240" r="5" fill="#64748B"/>
    <text x="90" y="245" fill="#CBD5E1" font-size="13" font-weight="650">Assinaturas</text>
    <circle cx="74" cy="288" r="5" fill="#14B8A6"/>
    <text x="90" y="293" fill="#FFFFFF" font-size="13" font-weight="800">Discord Sync</text>
    <circle cx="74" cy="336" r="5" fill="#64748B"/>
    <text x="90" y="341" fill="#CBD5E1" font-size="13" font-weight="650">E-mails</text>
    <circle cx="74" cy="384" r="5" fill="#64748B"/>
    <text x="90" y="389" fill="#CBD5E1" font-size="13" font-weight="650">Auditoria</text>
    <circle cx="74" cy="432" r="5" fill="#64748B"/>
    <text x="90" y="437" fill="#CBD5E1" font-size="13" font-weight="650">Suporte</text>
  </g>

  <rect x="226" y="54" width="990" height="96" rx="22" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="258" y="94" class="font h1">Operação · Discord Sync</text>
  <text x="260" y="124" class="font body" fill="#64748B">Controle de acesso, pagamentos, e-mails e cargos do Discord em tempo real.</text>
  <rect x="1008" y="75" width="176" height="42" rx="21" fill="#DCFCE7" stroke="#86EFAC"/>
  <circle cx="1030" cy="96" r="6" fill="#22C55E"/>
  <text x="1046" y="101" class="font green" font-size="14" font-weight="800">Sistema online</text>

  <g>
    <rect x="226" y="172" width="228" height="104" rx="18" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="250" y="208" class="font label">ASSINATURAS ATIVAS</text>
    <text x="250" y="248" class="font number">184</text>
    <text x="336" y="246" class="font muted">+12 hoje</text>

    <rect x="478" y="172" width="228" height="104" rx="18" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="502" y="208" class="font label">PENDÊNCIAS CRÍTICAS</text>
    <text x="502" y="248" class="font number">6</text>
    <text x="552" y="246" class="font muted">para revisar</text>

    <rect x="730" y="172" width="228" height="104" rx="18" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="754" y="208" class="font label">CARGOS CORRETOS</text>
    <text x="754" y="248" class="font number">98.7%</text>

    <rect x="982" y="172" width="234" height="104" rx="18" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="1006" y="208" class="font label">TEMPO MÉDIO DA FILA</text>
    <text x="1006" y="248" class="font number">12s</text>
  </g>

  <rect x="226" y="300" width="474" height="340" rx="20" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="254" y="338" class="font h2">Diagnóstico de acesso</text>
  <rect x="538" y="316" width="132" height="30" rx="15" fill="#DCFCE7" stroke="#86EFAC"/>
  <text x="558" y="336" class="font green" font-size="12" font-weight="800">Acesso liberado</text>
  <text x="254" y="366" class="font body">cliente.demo+01@example.com</text>
  <text x="254" y="388" class="font muted">Plano Mensal · Discord vinculado · Cargo aplicado</text>

  <line x1="272" y1="430" x2="272" y2="590" stroke="#CBD5E1" stroke-width="3"/>
  <circle cx="272" cy="430" r="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/>
  <text x="300" y="425" class="font body">Pagamento aprovado</text>
  <text x="300" y="446" class="font muted">Webhook processado às 08:14</text>
  <circle cx="272" cy="484" r="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/>
  <text x="300" y="479" class="font body">E-mail entregue</text>
  <text x="300" y="500" class="font muted">Link de acesso enviado para o cliente</text>
  <circle cx="272" cy="538" r="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/>
  <text x="300" y="533" class="font body">Discord vinculado</text>
  <text x="300" y="554" class="font muted">Usuário Demo | @cliente.demo</text>
  <circle cx="272" cy="592" r="10" fill="#DCFCE7" stroke="#22C55E" stroke-width="3"/>
  <text x="300" y="587" class="font body">Cargo Assinante aplicado</text>
  <text x="300" y="608" class="font muted">Sincronização concluída automaticamente</text>

  <rect x="728" y="300" width="488" height="160" rx="20" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="756" y="338" class="font h2">Pendências de acesso</text>
  <text x="1072" y="338" class="font muted">dados fictícios</text>
  <line x1="756" y1="360" x2="1188" y2="360" stroke="#E2E8F0"/>
  <text x="756" y="389" class="font body">cliente.demo+02@example.com</text>
  <text x="1000" y="389" class="font amber">Fora do servidor</text>
  <rect x="1120" y="372" width="68" height="28" rx="14" fill="#FEF3C7"/>
  <text x="1133" y="390" class="font amber" font-size="12" font-weight="800">Orientar</text>
  <text x="756" y="425" class="font body">cliente.demo+03@example.com</text>
  <text x="1000" y="425" class="font blue">Cargo pendente</text>
  <rect x="1112" y="408" width="76" height="28" rx="14" fill="#DBEAFE"/>
  <text x="1124" y="426" class="font blue" font-size="12" font-weight="800">Sincronizar</text>

  <rect x="728" y="480" width="236" height="160" rx="20" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="756" y="518" class="font h2">Fila Discord</text>
  <text x="756" y="548" class="font muted">Últimas horas</text>
  <polyline points="760,602 790,586 820,594 850,558 880,572 910,534 940,548" fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="760,620 790,614 820,612 850,604 880,610 910,592 940,598" fill="none" stroke="#14B8A6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="910" cy="534" r="6" fill="#2563EB"/>
  <text x="756" y="632" class="font muted">OK</text>
  <text x="904" y="632" class="font muted">Falhas</text>

  <rect x="986" y="480" width="230" height="160" rx="20" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1014" y="518" class="font h2">Integrações</text>
  <g class="font">
    <rect x="1014" y="540" width="174" height="26" rx="13" fill="#DCFCE7"/>
    <circle cx="1030" cy="553" r="5" fill="#22C55E"/>
    <text x="1044" y="558" class="green" font-size="12" font-weight="800">Webhook online</text>
    <rect x="1014" y="576" width="174" height="26" rx="13" fill="#DCFCE7"/>
    <circle cx="1030" cy="589" r="5" fill="#22C55E"/>
    <text x="1044" y="594" class="green" font-size="12" font-weight="800">Bot conectado</text>
    <rect x="1014" y="612" width="174" height="26" rx="13" fill="#DBEAFE"/>
    <circle cx="1030" cy="625" r="5" fill="#2563EB"/>
    <text x="1044" y="630" class="blue" font-size="12" font-weight="800">Tempo real ativo</text>
  </g>

  <rect x="1010" y="654" width="206" height="24" rx="12" fill="#F1F5F9"/>
  <text x="1024" y="671" class="font mono" font-size="11" font-weight="700" fill="#64748B">preview demo · sem dados reais</text>
</svg>
